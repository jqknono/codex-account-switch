name: Publish CLI to npm

on:
  push:
    tags:
      - "cli-v*"
  workflow_dispatch:
    inputs:
      npm_tag:
        description: "npm dist-tag to publish"
        required: false
        default: "latest"
      version:
        description: "Expected CLI version in packages/cli/package.json"
        required: false

jobs:
  publish-cli:
    name: Publish CLI package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Upgrade npm for trusted publishing
        run: npm install --global npm@^11.10.0

      - name: Install dependencies
        run: npm ci

      - name: Run CLI release tests
        run: npm run test -w packages/cli

      - name: Resolve publish inputs
        id: publish
        shell: bash
        env:
          INPUT_NPM_TAG: ${{ github.event.inputs.npm_tag }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail

          package_version="$(node -p "require('./packages/cli/package.json').version")"
          default_tag="latest"
          if [[ "${package_version}" == *-* ]]; then
            default_tag="next"
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            tag_version="${GITHUB_REF_NAME#cli-v}"
            if [[ "${tag_version}" != "${package_version}" ]]; then
              echo "Tag version ${tag_version} does not match package version ${package_version}." >&2
              exit 1
            fi
            publish_tag="${default_tag}"
          else
            if [[ -n "${INPUT_VERSION}" && "${INPUT_VERSION}" != "${package_version}" ]]; then
              echo "Workflow input version ${INPUT_VERSION} does not match package version ${package_version}." >&2
              exit 1
            fi
            publish_tag="${INPUT_NPM_TAG:-${default_tag}}"
          fi

          echo "package_version=${package_version}" >> "${GITHUB_OUTPUT}"
          echo "publish_tag=${publish_tag}" >> "${GITHUB_OUTPUT}"

      - name: Publish CLI package
        working-directory: packages/cli
        run: npm publish --tag "${{ steps.publish.outputs.publish_tag }}"
